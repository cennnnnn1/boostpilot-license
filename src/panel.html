<title>BoostPilot</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07080f; --bg2: #0b0e1a; --panel: #111527; --panel2: #161b2e; --line: #20263c;
    --text: #eef1fb; --muted: #8b93ad; --dim: #5d6580; --fg: #eef1fb;
    --pink: #ff6a8a; --pink2: #e8437e; --pink3: #ff9dc0;
    --gold: #ff6a8a; --gold2: #ff9dc0; --amber: #e8437e;
    --green: #34d399; --blue: #66b3ff; --red: #f87171; --purple: #a855f7;
    --grad: linear-gradient(135deg, #ff9dc0 0%, #ff6a8a 45%, #e8437e 100%);
    --glowGold: rgba(255,106,138,.16);
    --radius: 16px;
    --shadow: 0 14px 40px rgba(2,6,18,.55);
    --font: 'Segoe UI Variable Display', 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(900px 520px at 85% -10%, rgba(232,67,126,.14), transparent 60%),
      radial-gradient(820px 520px at -10% 8%, rgba(168,85,247,.10), transparent 55%),
      radial-gradient(900px 600px at 50% 120%, rgba(255,106,138,.08), transparent 60%),
      linear-gradient(180deg, #0a0d1a 0%, #07080f 100%);
    background-attachment: fixed;
    color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(80% 60% at 50% 0%, #000, transparent 75%);
            mask-image: radial-gradient(80% 60% at 50% 0%, #000, transparent 75%);
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(146,163,195,.18); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,106,138,.32); background-clip: content-box; }
  ::selection { background: rgba(255,106,138,.28); }

  header.topbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
    padding: 12px 20px;
    background: linear-gradient(180deg, rgba(10,14,26,.92), rgba(10,14,26,.68));
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    border-bottom: 1px solid rgba(255,255,255,.06);
    -webkit-app-region: drag;
  }
  header.topbar button, header.topbar select, header.topbar input, header.topbar a { -webkit-app-region: no-drag; }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; white-space: nowrap; }
  .brand-logo {
    width: 42px; height: 42px; border-radius: 13px; flex: none;
    background: transparent; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(255,106,138,.45);
    position: relative; overflow: hidden;
  }
  .brand-logo svg { width: 42px; height: 42px; display: block; position: relative; z-index: 1; }
  .brand-name { font-size: 17px; font-weight: 800; letter-spacing: .2px; line-height: 1.1; }
  .brand-name em { font-style: normal; background: linear-gradient(90deg, #ff9dc0, #e8437e, #ff6a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  nav.tabs { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1 1 auto; justify-content: center; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 9px; cursor: pointer; font-size: 12px; font-weight: 600;
    border-radius: 999px; transition: all .18s ease; position: relative;
  }
  nav.tabs button:hover { color: var(--text); background: rgba(255,255,255,.05); }
  nav.tabs button.active {
    color: var(--gold2); background: linear-gradient(180deg, rgba(255,106,138,.16), rgba(232,67,126,.08));
    border-color: rgba(255,106,138,.35); box-shadow: 0 0 0 1px rgba(255,106,138,.12) inset, 0 4px 18px rgba(232,67,126,.12);
  }
  nav.tabs button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button .tab-sym { font-size: 12px; line-height: 1; color: var(--gold); opacity: .9; }
  .seg { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 130px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .18s ease; text-align: center; }
  .seg button:hover { color: var(--text); border-color: rgba(255,106,138,.45); }
  .seg button.active { color: var(--gold2); border-color: rgba(255,106,138,.5); background: rgba(255,106,138,.12); box-shadow: 0 0 0 1px rgba(255,106,138,.15) inset; }
  .badge { display: inline-block; min-width: 19px; background: var(--grad); color: #1a0710; border-radius: 999px; font-size: 11px; font-weight: 800; padding: 1px 6px; text-align: center; }
  .tab-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; background: linear-gradient(135deg, #ff9dc0, #ff6a8a); color: #1a0710; border-radius: 999px; font-size: 10.5px; font-weight: 800; line-height: 1; box-shadow: 0 2px 10px rgba(255,106,138,.45); }
  .wh-steps { margin: 0 0 14px; padding-left: 20px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .wh-steps li { margin-bottom: 2px; }
  .wh-steps b { color: var(--fg); }
  .pr-game { border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); padding: 16px; margin: 0 0 14px; }
  .pr-game h4 { margin: 0 0 4px; font-size: 16px; color: var(--gold); }
  .pr-cat { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .pr-cat h5 { margin: 0 0 8px; font-size: 13.5px; color: var(--fg); text-transform: uppercase; letter-spacing: .4px; }
  .pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .pr-field { display: flex; flex-direction: column; gap: 4px; }
  .pr-field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
  .pr-field input { width: 100%; }
  .pr-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pr-mult { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; }
  .pr-mult .pr-field { width: 150px; }
  .spacer { flex: 1; }
  .top-right { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; white-space: nowrap; }
  .lang-box { display: flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; }
  .lang-box label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .ctrl { display: flex; align-items: center; gap: 10px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .hd-mode-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .lang-box select { padding: 5px 8px; font-size: 12px; font-weight: 600; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 999px;
    border: 1px solid var(--line); letter-spacing: .3px; white-space: nowrap;
  }
  .status-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; }
  .status-pill.active { color: var(--green); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.1); }
  .status-pill.active::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status-pill.paused { color: var(--amber); border-color: rgba(232,67,126,.4); background: rgba(232,67,126,.1); }
  .status-pill.paused::before { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .btn-pause { background: rgba(96,165,250,.12); border-color: rgba(96,165,250,.4); color: var(--blue); }
  .btn-pause:hover:not(:disabled) { background: rgba(96,165,250,.22); }
  .btn-resume { background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.45); color: var(--green); }
  .btn-resume:hover:not(:disabled) { background: rgba(52,211,153,.25); }
  .btn-logout {
    flex: none; background: linear-gradient(135deg, #ff5b5b, #e53935); color: #fff;
    border: 1px solid rgba(255,255,255,.18); box-shadow: 0 4px 14px rgba(229,57,53,.35);
    padding: 7px 12px; font-size: 12.5px;
  }
  .btn-logout:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(229,57,53,.45); }
  .status-pill.sub { font-size: 11px; padding: 6px 10px; }
  .status-pill.sub.ok { color: var(--gold2); border-color: rgba(255,106,138,.4); background: rgba(255,106,138,.1); }
  .status-pill.sub.ok::before { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .status-pill.sub.bad { color: var(--red); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.1); }
  .status-pill.sub.bad::before { background: var(--red); box-shadow: 0 0 8px var(--red); }

  .login-wrap {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(255,106,138,.14), transparent 60%),
      radial-gradient(800px 400px at -10% 0%, rgba(102,179,255,.12), transparent 55%),
      radial-gradient(700px 500px at 50% 115%, rgba(255,106,138,.08), transparent 60%),
      #000;
  }
  .login-box {
    background: linear-gradient(180deg, rgba(24,33,56,.96), rgba(17,24,43,.88));
    border: 1px solid rgba(255,255,255,.11); border-radius: 24px; padding: 40px 44px;
    width: 400px; max-width: calc(100vw - 40px); text-align: center;
    box-shadow: var(--shadow), 0 0 0 1px rgba(255,106,138,.06) inset;
    animation: loginIn .35s ease;
  }
  @keyframes loginIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .login-box .brand-logo { margin: 0 auto; width: 64px; height: 64px; border-radius: 19px; }
  .login-box .brand-logo svg { width: 64px; height: 64px; }
  .login-box h1 { font-size: 22px; margin: 18px 0 6px; }
  .login-box .login-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; line-height: 1.5; }
  .login-box input#loginKey {
    width: 100%; text-align: center; font-size: 17px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 14px; padding: 12px;
    background: rgba(255,255,255,.04);
  }
  .login-box .btn { width: 100%; justify-content: center; }
  .login-msg { min-height: 18px; margin-top: 12px; font-size: 13px; color: var(--red); }

  .admin-wrap { width: 980px; max-width: calc(100vw - 30px); max-height: calc(100vh - 30px); overflow: auto; }
  .admin-card {
    background: linear-gradient(180deg, var(--panel) 0%, rgba(21,29,48,.6) 100%);
    border: 1px solid var(--line); border-radius: 20px; padding: 30px 34px;
    max-width: 460px; margin: 60px auto 20px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .admin-close {
    position: absolute; top: 16px; right: 20px; z-index: 10;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .admin-close:hover { color: var(--fg); border-color: var(--gold); }
  #adminOverlay .set-box { width: 100%; }
  #adminOverlay .savebar-inline h3 { margin: 0; }

  .pill.active { background: rgba(52,211,153,.14); color: var(--green); }
  .pill.expired { background: rgba(248,113,113,.14); color: var(--red); }
  .pill.revoked { background: rgba(143,160,189,.14); color: var(--muted); }
  .pill.unused { background: rgba(96,165,250,.14); color: var(--blue); }
  .pill.paypend { background: rgba(232,67,126,.14); color: var(--amber); }
  .pill.paid { background: rgba(52,211,153,.14); color: var(--green); }
  .pill.vip { background: rgba(255,106,138,.2); color: var(--gold2); font-weight: 800; }
  .eldo-user { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg2); margin: 0 0 14px; }
  .eldo-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #ff9dc0, #e8437e); color: #1a0710; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; flex: none; background-size: cover; background-position: center; background-repeat: no-repeat; overflow: hidden; }
  .eldo-name { font-size: 17px; font-weight: 800; color: var(--fg); }
  .eldo-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .ktable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ktable th {
    text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  .ktable td { padding: 9px 10px; border-bottom: 1px solid rgba(36,48,79,.5); vertical-align: middle; }
  .ktable tr:hover td { background: rgba(255,255,255,.02); }
  .ktable .kkey { font-family: 'Cascadia Code', Consolas, monospace; font-weight: 700; letter-spacing: .5px; color: var(--gold2); white-space: nowrap; }
  .ktable .kacts { display: flex; gap: 6px; }
  .kgenlist { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .kgenrow { display: flex; align-items: center; gap: 10px; }
  .kgenrow code {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font-family: 'Cascadia Code', Consolas, monospace; color: var(--gold2); letter-spacing: 1px;
  }
  #adminKey { max-width: 320px; font-size: 16px; letter-spacing: 2px; }
  select {
    background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: 10px; font-size: 13.5px; outline: none; cursor: pointer;
    color-scheme: dark; appearance: auto;
  }
  select option { background-color: #121a2c; color: #eef2fc; }
  select:focus { border-color: rgba(255,106,138,.5); }

  main { padding: 26px 28px 60px; max-width: 1280px; margin: 0 auto; }
  .tab { display: none; animation: fade .18s ease; }
  .tab.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .stat {
    background: linear-gradient(165deg, rgba(255,255,255,.08) 0%, rgba(24,33,56,.95) 100%);
    border: 1px solid rgba(255,255,255,.09); border-radius: 18px; padding: 14px 16px;
    position: relative; overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    box-shadow: 0 8px 24px rgba(2,6,18,.35);
  }
  .stat::before { content: ''; position: absolute; inset: -45% -25% auto -25%; height: 85%; background: radial-gradient(closest-side, var(--glow, var(--blue)), transparent); opacity: .22; pointer-events: none; }
  .stat:hover { transform: translateY(-3px); border-color: var(--glow, var(--blue)); box-shadow: 0 14px 34px rgba(2,6,18,.5); }
  .stat::after { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--glow, var(--blue)); opacity: .95; }
  .stat .s-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stat .ic { width: 36px; height: 36px; padding: 8px; box-sizing: border-box; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.06); border-radius: 11px; }
  .stat .v { font-size: 26px; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 7px; }
  .stat.pending { --glow: var(--blue); } .stat.pending .ic, .stat.pending .v { color: var(--blue); }
  .stat.subcard {
    --glow: var(--blue);
    border-color: rgba(102,179,255,.25);
    background: linear-gradient(165deg, rgba(102,179,255,.14) 0%, rgba(24,33,56,.95) 55%);
    text-align: center;
    display: flex; flex-direction: column;
  }
  .stat.subcard .s-top { justify-content: center; }
  .stat.subcard .sub-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--blue); font-weight: 800; }
  .stat.subcard .sub-big { font-size: 24px; font-weight: 800; color: var(--blue); margin-top: 8px; line-height: 1.05; letter-spacing: -.5px; }
  .stat.subcard .sub-clock { font-family: 'Consolas', 'Menlo', 'Courier New', monospace; font-size: 15px; font-weight: 700; color: var(--blue); margin-top: 3px; letter-spacing: 1px; }
  .stat.subcard .sub-bar { height: 5px; border-radius: 999px; background: rgba(102,179,255,.15); margin-top: 9px; overflow: hidden; }
  .stat.subcard .sub-bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #66b3ff, #a8d8ff); box-shadow: 0 0 10px rgba(102,179,255,.65); transition: width .3s ease; }
  .stat.placed { --glow: var(--blue); } .stat.placed .ic, .stat.placed .v { color: var(--blue); }
  .stat.skipped { --glow: var(--blue); } .stat.skipped .ic, .stat.skipped .v { color: var(--blue); }
  .stat.seen { --glow: var(--muted); } .stat.seen .ic, .stat.seen .v { color: var(--muted); }
  .stat.opened { --glow: var(--green); } .stat.opened .ic, .stat.opened .v { color: var(--green); }
  .stat.rejected { --glow: var(--red); } .stat.rejected .ic, .stat.rejected .v { color: var(--red); }
  .stat.canceled { --glow: var(--red); } .stat.canceled .ic, .stat.canceled .v { color: var(--red); }
  .stat.unresolved { --glow: var(--purple); } .stat.unresolved .ic, .stat.unresolved .v { color: var(--purple); }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
  .chart-box { background: linear-gradient(180deg, rgba(25,34,58,.82), rgba(18,25,44,.62)); border: 1px solid rgba(255,255,255,.09); border-radius: var(--radius); padding: 16px 18px; box-shadow: 0 8px 24px rgba(2,6,18,.25); }
  .chart-box h4 { margin: 0 0 12px; font-size: 13px; color: var(--gold2); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .bars .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
  .bars .bar i { width: 70%; background: linear-gradient(180deg, var(--gold), #e8437e); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bars .bar small { font-size: 10px; color: var(--muted); }
  .hrow { display: flex; align-items: center; gap: 6px; margin: 2px 0; font-size: 12px; }
  .hrow .hn { width: 120px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pr-game-opts { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .pr-game-filters { display: flex; align-items: center; gap: 8px; }

  .filter-pills { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }

  if (this.dataset.capture !== '1') return;

  if (e.key === 'Tab' || e.key === 'Enter' || e.key === 'Escape') { this.blur(); return; }
  var parts = [];
  if (e.ctrlKey) parts.push('Ctrl');
  if (e.altKey) parts.push('Alt');
  if (e.shiftKey) parts.push('Shift');
  var k = e.key.length === 1 ? e.key.toUpperCase() : (e.key.startsWith('F') && /^F\d+$/.test(e.key) ? e.key : null);
  if (k && parts.length > 0) this.value = parts.join('+') + '+' + k;
  else if (k === 'F1' || (k && /^F\d+$/.test(k))) this.value = k;
});

function renderCharts(rows) {
  var placed = rows.filter(function (r) { return r.status === 'placed'; });
  var dayEl = document.getElementById('histDays');
  var gameEl = document.getElementById('histGames');
  if (!dayEl || !gameEl) return;
  var days = [];
  var now = new Date();
  for (var i = 13; i >= 0; i--) days.push({ d: new Date(now.getFullYear(), now.getMonth(), now.getDate() - i), c: 0 });
  placed.forEach(function (r) {
    var t = new Date(r.seenAt || r.createdAt);
    for (var j = 0; j < days.length; j++) {
      if (days[j].d.getFullYear() === t.getFullYear() && days[j].d.getMonth() === t.getMonth() && days[j].d.getDate() === t.getDate()) { days[j].c++; break; }
    }
  });
  var max = 1;
  days.forEach(function (x) { if (x.c > max) max = x.c; });
  dayEl.innerHTML = days.map(function (x) {
    var h = Math.round(x.c / max * 100);
    return '<div class="bar"><i style="height:' + Math.max(2, h) + '%"></i><small>' + x.d.getDate() + '</small></div>';
  }).join('');
  var gm = {};
  placed.forEach(function (r) { var k = r.game || '?'; gm[k] = (gm[k] || 0) + 1; });
  var gmax = 1;
  Object.keys(gm).forEach(function (k) { if (gm[k] > gmax) gmax = gm[k]; });
  gameEl.innerHTML = Object.keys(gm).length ? Object.keys(gm).map(function (k) {
    var w = Math.round(gm[k] / gmax * 100);
    return '<div class="hrow"><span class="hn">' + esc(GAME_NAMES[k] || k) + '</span><span class="hb"><i style="width:' + w + '%"></i></span><span class="hv">' + gm[k] + '</span></div>';
  }).join('') : '<div style="color:var(--dim);font-size:12px">\u2014</div>';
}

var HIST_STATUSES = ['placed', 'pending', 'opened', 'messaged', 'skipped', 'rejected', 'unresolved', 'ready', 'failed', 'canceled', 'seen'];
function renderHistory() {
  var table = document.getElementById('histTable');
  if (!table) return;
  var gameSel = document.getElementById('histGame');
  var stSel = document.getElementById('histStatus');
  if (gameSel && gameSel.options.length === 0) {
    var games = {};
    allRows.forEach(function (r) { if (r.game) games[r.game] = 1; });
    var opts = Object.keys(games).sort().map(function (g) { return '<option value="' + esc(g) + '">' + esc(GAME_NAMES[g] || g) + '</option>'; }).join('');
    gameSel.innerHTML = '<option value="all">' + esc(t('hist_all')) + '</option>' + opts;
  }
  if (stSel && stSel.options.length === 0) {
    stSel.innerHTML = '<option value="all">' + esc(t('hist_all')) + '</option>' +
      HIST_STATUSES.map(function (s) { return '<option value="' + s + '">' + esc(t('st_' + s)) + '</option>'; }).join('');
  }
  var fGame = gameSel ? gameSel.value : 'all';
  var fStatus = stSel ? stSel.value : 'all';
  var searchEl = document.getElementById('histSearch');
  var fSearch = (searchEl ? searchEl.value : '').trim().toLowerCase();
  var list = allRows.filter(function (r) {
    if (fGame !== 'all' && r.game !== fGame) return false;
    if (fStatus !== 'all' && r.status !== fStatus) return false;
    if (fSearch) {
      var hay = ((r.description || '') + ' ' + (r.buyer || '') + ' ' + (r.category || '')).toLowerCase();
      if (hay.indexOf(fSearch) === -1) return false;
    }
    return true;
  });
  renderCharts(allRows);
  var countEl = document.getElementById('histCount');

    table.innerHTML = '<div class="empty" style="display:block"><div>' + esc(t('hist_none')) + '</div></div>';

    '<th>' + esc(t('hist_game')) + '</th>' +
    '<th>' + esc(t('hist_desc')) + '</th>' +
    '<th>' + esc(t('hist_buyer')) + '</th>' +
    '<th>' + esc(t('hist_price')) + '</th>' +
    '<th>' + esc(t('hist_status')) + '</th>' +
    (list.some(function (r) { return orderInfoMap[r.id]; }) ? '<th>' + esc(t('hist_resp')) + '</th>' : '') +
    (list.some(function (r) { return r.href; }) ? '<th></th>' : '') +
    '</tr></thead><tbody>' +
    list.map(function (r) {
      var d = fmtDate(r.seenAt || r.createdAt);
      var st = statusBadge(r.status);
      var link = r.href ? '<td><button class="btn btn-ghost histOpen" data-href="' + esc(r.href) + '">' + esc(t('hist_open')) + '</button></td>' : '';
      var info = orderInfoMap[r.id];
      var resp = '';
      if (info) {
        if (info.responded) {
          resp = '<td><span class="resp-badge resp-ok">' + esc(t('hist_responded')) + '</span></td>';
        } else {
          resp = '<td><span class="resp-badge resp-warn">' + esc(t('hist_noresponse')) + '</span> <button class="btn btn-ghost histRemind" data-id="' + esc(r.id) + '" data-buyer="' + esc(r.buyer || '') + '">' + esc(t('hist_remind')) + '</button></td>';
        }

        '<td style="white-space:nowrap">' + esc(d) + '</td>' +
        '<td class="hgame">' + esc(GAME_NAMES[r.game] || r.game || '') + '</td>' +
        '<td class="hdesc" title="' + esc(r.description || '') + '">' + esc(r.description || '') + '</td>' +
        '<td>' + esc(r.buyer || '') + '</td>' +
        '<td>' + (r.price != null ? '$' + esc(String(r.price)) : '\u2014') + '</td>' +

      prestigeImage: document.getElementById('c-prestigeImg').value.trim(),
      prestigeDelayMs: Math.max(0, Math.round(parseFloat(document.getElementById('c-prestigeDelay').value) || 0) * 1000),
      customRequestEnabled: chk('c-custom'),

      customRequestImage: document.getElementById('c-customImg').value.trim(),
      customRequestDelayMs: Math.max(0, Math.round(parseFloat(document.getElementById('c-customDelay').value) || 0) * 1000),
      followUpEnabled: chk('c-follow'),
      followUpMessage: document.getElementById('c-followMsg').value,

      followUpDelayMs: Math.max(0, Math.round(parseFloat(document.getElementById('c-followDelay').value) || 0) * 1000),

function eldoPoll(msg, btn, onDone) {
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    fetch('/api/eldo/session')
      .then(function (r) { return r.json(); })
      .then(function (st) {
        var ls = st.login || null;
        if (st.linked) {
          clearInterval(iv);
          msg.textContent = t('eldo_done');
          btn.disabled = false;
          onDone();
          return;
        }
        if (ls && ls.busy) {
          var s = eldoStatusText(ls);
          if (s) msg.textContent = s;
          return;
        }
        if (ls && ls.status === 'failed') {
          clearInterval(iv);
          msg.textContent = t('eldo_st_failed');
          btn.disabled = false;
          return;
        }
        if (tries > 200) {
          clearInterval(iv);
          msg.textContent = t('eldo_timeout');
          btn.disabled = false;
        }
      }).catch(function () {});
  }, 3000);
}

var allRows = [];

function itKey(it) {
  return (it.status || '') + '|' + (it.seenAt || it.createdAt || '') + '|' + (it.price != null ? it.price : '') + '|' + (it.note || '') + '|' + (it.suggested ? '1' : '0');

function buildCard(it) {
  var tmp = document.createElement('div');
  tmp.innerHTML = itemHtml(it);
  var card = tmp.firstElementChild;
  if (card) card.setAttribute('data-key', itKey(it));
  return card;
}
function reconcileList(box, items) {
  var wanted = {};
  items.forEach(function (it) {
    var w = wanted[it.id];
    if (w) { w.it = it; w.key = itKey(it); }
    else wanted[it.id] = { it: it, key: itKey(it), node: null, stale: null };
  });
  var cur = [];
  var hasStale = false;
  Array.prototype.slice.call(box.children).forEach(function (node) {
    var id = node.getAttribute('data-id');
    var w = id ? wanted[id] : null;
    if (w && node.getAttribute('data-key') === w.key) { w.node = node; cur.push(id); return; }
    if (w) { w.stale = node; hasStale = true; }
    if (!node.classList.contains('removing')) {
      node.classList.add('removing');
      (function (n) { setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 600); })(node);
    }
  });
  items.forEach(function (it) {
    var w = wanted[it.id];
    if (w && w.node) {
      var lm = w.node.querySelector('.lmsg');
      if (lm) {
        var ed = edits[it.id];
        if (!ed || ed.message == null) {
          var want = defaultMsgFor(it);
          if (lm.value !== want) lm.value = want;
        }
      }
    }
  });
  var same = cur.length === items.length;
  for (var i = 0; same && i < items.length; i++) if (cur[i] !== items[i].id) same = false;
  if (same && !hasStale) return;
  var ins = box.firstChild;
  items.forEach(function (it) {
    var w = wanted[it.id];
    var card = w.node;
    if (!card) { card = buildCard(it); card.classList.add('fadein'); w.node = card; }
    if (card !== ins) box.insertBefore(card, ins);
    ins = card.nextSibling;
  });
  items.forEach(function (it) {
    var w = wanted[it.id];
    if (w.stale && w.stale.parentNode) w.stale.parentNode.removeChild(w.stale);
  });
}

var subUntil = 0;
var subTotal = 0;
var subActive = false;
function fmtRemaining(ms) {
  ms = Math.max(0, ms);
  var d = Math.floor(ms / 86400000);
  var h = Math.floor((ms % 86400000) / 3600000);
  var m = Math.floor((ms % 3600000) / 60000);
  var s = Math.floor((ms % 60000) / 1000);
  return t('sub_expires_in') + ' ' + t('sub_count').replace('{d}', d).replace('{h}', h).replace('{m}', m).replace('{s}', s);
}
function tickSub() {
  var hClock = document.getElementById('healthSubClock');
  if (!subActive) { if (hClock) hClock.textContent = ''; return; }
  if (!subUntil) {
    if (hClock) hClock.textContent = ' \u2022 \u221e';
    return;
  }
  var ms = subUntil - Date.now();
  if (ms <= 0) {
    if (hClock) hClock.textContent = ' \u2022 ' + t('sub_expired');
    return;
  }
  var d = Math.floor(ms / 86400000);
  var h = Math.floor((ms % 86400000) / 3600000);
  var m = Math.floor((ms % 3600000) / 60000);
  var s = Math.floor((ms % 60000) / 1000);
  var lbl = '';
  if (d > 0) lbl = d + 'd ' + h + 'h ' + m + 'm';
  else if (h > 0) lbl = h + 'h ' + m + 'm ' + s + 's';
  else if (m > 0) lbl = m + 'm ' + s + 's';
  else lbl = s + 's';
  if (hClock) hClock.textContent = ' \u2022 ' + lbl;
}
function applySub(session) {
  var out = document.getElementById('btnLogout');
  subActive = !!session;
  if (!session) {
    subUntil = 0;
    subTotal = 0;
    if (out) out.style.display = 'none';
    tickSub();
    return;
  }
  subUntil = session.expiresAt ? new Date(session.expiresAt).getTime() : 0;
  subTotal = subUntil && session.activatedAt ? subUntil - new Date(session.activatedAt).getTime() : 0;
  var until = session.expiresAt ? t('sub_until') + ' ' + fmtDate(session.expiresAt) : '';
  var card = document.getElementById('timeCard');
  if (card) card.title = (session.owner ? session.owner + ' \u00b7 ' : '') + (session.plan || '') + (until ? ' | ' + until : '');
  if (out) out.style.display = 'inline-flex';
  tickSub();
}

    .then(function (res) { return res.json(); })
    .then(function (d) {
      if (d.ok) {
        msg.innerHTML = '<span style="display:block;margin-top:4px">' + esc(t('k_generated')) + '</span><div class="kgenlist">' +
          d.keys.map(function (k) {
            return '<div class="kgenrow"><code>' + esc(k.key) + '</code><button class="btn btn-ghost kcopy" data-k="' + esc(k.key) + '">' + esc(t('k_copy')) + '</button></div>';
          }).join('') +
          '</div>';
        loadAdminKeys();
      } else {
        msg.textContent = t('st_error') + ' ' + (d.error || t('st_unknown'));
      }
      btn.disabled = false;
    })
    .catch(function () { msg.textContent = t('login_err_conn'); btn.disabled = false; });
}

function adminDownload(url, filename) {
  fetch(url).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.blob();
  }).then(function (blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }).catch(function () { toast(t('st_errconn'), true); });
}

function adminShowLogs(key) {
  var box = document.getElementById('keyLogsBox');
  box.style.display = 'block';
  box.innerHTML = '<div class="set-row"><b>' + esc(t('k_log_title').replace('{n}', key)) + '</b><span class="spacer"></span><button class="btn btn-ghost" id="keyLogsClose">' + esc(t('k_close')) + '</button></div><div id="keyLogsList">' + esc(t('k_loading')) + '...</div>';
  document.getElementById('keyLogsClose').onclick = function () { box.style.display = 'none'; };
  fetch('/api/admin/keys/logs?key=' + encodeURIComponent(key))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var listEl = document.getElementById('keyLogsList');
      if (!listEl) return;
      if (!d.ok || !d.log || !d.log.length) { listEl.innerHTML = '<div class="empty" style="display:block"><div>' + esc(t('k_no_logs')) + '</div></div>'; return; }
      listEl.innerHTML = '<div class="kloglist">' + d.log.slice().reverse().map(function (e) {
        return '<div class="klogrow"><span class="t">' + esc(new Date(e.t).toLocaleTimeString()) + ' ' + esc(new Date(e.t).toLocaleDateString()) + '</span> <span>' + esc(e.msg) + '</span></div>';
      }).join('') + '</div>';
    })
    .catch(function () { var l = document.getElementById('keyLogsList'); if (l) l.textContent = t('login_err_conn'); });
}

function adminUpdateKey(key, body, okMsg) {
  fetch('/api/admin/keys/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ key: key }, body)) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) { if (okMsg) toast(okMsg, false); loadAdminKeys(); }
      else toast(t('st_error') + ' ' + (d.error || t('st_unknown')), true);
    })
    .catch(function () { toast(t('login_err_conn'), true); });
}

function enterDashboard(sub) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('expiredScreen').style.display = 'none';
  applySub(sub);
  if (!dashboardReady) {
    dashboardReady = true;
    document.getElementById('confirmList').addEventListener('click', confirmAction);
    document.getElementById('confirmList').addEventListener('click', priceEditClick);
    document.getElementById('confirmList').addEventListener('input', saveEdit);
    document.getElementById('btnMarkAll').addEventListener('click', function () {
      var btn = this;
      if (btn.disabled) return;
      btn.disabled = true;
      var orig = btn.textContent;
      btn.textContent = t('btn_placing');
      fetch('/api/pending').then(function (r) { return r.json(); })
        .then(function (d) {
          var pending = d.pending || [];
          if (!pending.length) { btn.disabled = false; btn.textContent = orig; return; }
          var chain = Promise.resolve();
          pending.forEach(function (p) {
            chain = chain.then(function () {
              return fetch('/api/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: p.id, action: 'discard' }) });
            });
          });
          return chain;
        })
        .then(function () { btn.disabled = false; btn.textContent = orig; refreshConfirm(); refreshStats(); })
        .catch(function () { btn.disabled = false; btn.textContent = orig; });
    });
    document.getElementById('filterPills').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var filter = btn.getAttribute('data-filter');
      this.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      document.querySelectorAll('#confirmList .card').forEach(function (card) {
        if (filter === 'all') { card.style.display = ''; return; }
        card.style.display = card.getAttribute('data-status') === filter ? '' : 'none';
      });
    });
  }
  fetch('/api/config')
    .then(function (res) { return res.json(); })
    .then(function (cfg) {
      etas = cfg.etas || []; etaMap = cfg.etaMap || {}; baseConfig = cfg;
      fillSettings(cfg);
      refreshAll();
    })
    .catch(function () {});
  if (!intervalStarted) {
    intervalStarted = true;
    var refreshTimer = null, consoleTimer = null;
    function startTimers() {
      if (refreshTimer) return;
      refreshTimer = setInterval(function () { refreshAll(); }, 5000);
      consoleTimer = setInterval(function () { if (ACTIVE_TAB === 'cons') refreshConsole(); }, 2000);
    }
    function stopTimers() {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
      if (consoleTimer) { clearInterval(consoleTimer); consoleTimer = null; }
    }
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopTimers();
      else { startTimers(); refreshAll(); }
    });
    startTimers();
    setInterval(tickSub, 1000);
  }
}

function checkSession() {
  fetch('/api/me')
    .then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) { return { status: res.status, d: d }; });
    })
    .then(function (r) {
      if (r.d && r.d.ok && r.d.login === false) { enterDashboard(null); return; }
      if (r.d && r.d.ok && r.d.subscription) { enterDashboard(r.d.subscription); return; }
      if (r.status === 401 && r.d && r.d.error === 'expired') { showExpired(); return; }
      showLogin();
    })
    .catch(function () { showLogin(); });
}

function watchSession() {
  fetch('/api/me')
    .then(function (res) { if (res.status === 401) checkSession(); })
    .catch(function () {});
}

function init() {
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('expiredBtn').addEventListener('click', logout);
  document.getElementById('btnLogout').addEventListener('click', logout);
  document.getElementById('loginKey').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('loginKey').addEventListener('input', function () {
    var v = this.value.toUpperCase().replace(/[^A-F0-9]/g, '');
    var parts = v.match(/.{1,4}/g) || [];
    this.value = parts.join('-');
  });
  document.getElementById('btnLogout').addEventListener('click', logout);
  document.getElementById('adminBtn').addEventListener('click', adminLogin);
  document.getElementById('adminKey').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') adminLogin();
  });
  document.getElementById('adminLeave').addEventListener('click', adminLogout);
  document.getElementById('adminGenBtn').addEventListener('click', adminGenerate);
  document.getElementById('adminRefresh').addEventListener('click', loadAdminKeys);
  document.getElementById('adminExport').addEventListener('click', function () { adminDownload('/api/admin/export', 'keys.csv'); });
  document.getElementById('adminBackup').addEventListener('click', function () { adminDownload('/api/admin/backup', 'elbot-backup.json'); });
  document.getElementById('adminSearch').addEventListener('input', loadAdminKeys);
  document.getElementById('adminStatusFilter').addEventListener('change', loadAdminKeys);
  document.getElementById('adminPlanFilter').addEventListener('change', loadAdminKeys);
  document.getElementById('keysTable').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var tr = btn.closest('tr');
    var key = tr && tr.getAttribute('data-key');
    if (!key) return;
    if (btn.classList.contains('adminLogs')) {
      adminShowLogs(key);
    } else if (btn.classList.contains('adminVip')) {
      var toVip = !(btn.textContent.indexOf(t('k_unset_vip')) === 0);
      fetch('/api/admin/keys/vip', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key, vip: toVip }) })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (d.ok) toast(t('k_vip_done'), false);
          else toast(t('st_error') + ' ' + (d.error || t('st_unknown')), true);
          loadAdminKeys();
        })
        .catch(function () { toast(t('login_err_conn'), true); });
    } else if (btn.classList.contains('adminClearDev')) {
      if (!confirm(t('k_clear_devices_q').replace('{n}', key))) return;
      adminUpdateKey(key, { clearDevices: true }, t('k_devices_cleared'));
    } else if (btn.classList.contains('adminReactivate')) {
      adminUpdateKey(key, { reactivate: true }, t('k_reactivated'));
    } else if (btn.classList.contains('adminDelete')) {
      if (!confirm(t('k_confirm_delete').replace('{n}', key))) return;
      fetch('/api/admin/keys/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key }) })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (d.ok) toast(t('k_deleted'), false);
          else toast(t('st_error') + ' ' + (d.error || t('st_unknown')), true);
          loadAdminKeys();
        })
        .catch(function () { toast(t('login_err_conn'), true); });
    } else if (btn.classList.contains('adminExtend')) {
      var days = prompt(t('k_extend_days'), '30');
      if (!days) return;
      days = parseInt(days, 10);
      if (!days || days < 1) return;
      fetch('/api/admin/keys/extend', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key, days: days }) })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (d.ok) toast(t('k_extended'), false);
          else toast(t('st_error') + ' ' + (d.error || t('st_unknown')), true);
          loadAdminKeys();
        })
        .catch(function () { toast(t('login_err_conn'), true); });
    } else if (btn.classList.contains('adminRevoke')) {
      if (!confirm(t('k_confirm_revoke').replace('{n}', key))) return;
      fetch('/api/admin/keys/revoke', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key }) })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (d.ok) toast(t('k_revoked'), false);
          else toast(t('st_error') + ' ' + (d.error || t('st_unknown')), true);
          loadAdminKeys();
        })
        .catch(function () { toast(t('login_err_conn'), true); });
    } else if (btn.classList.contains('adminPay')) {
      fetch('/api/admin/keys/markpaid', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key }) })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (d.ok) toast(t('k_marked_paid'), false);
          else toast(t('st_error') + ' ' + (d.error || t('st_unknown')), true);
          loadAdminKeys();
        })
        .catch(function () { toast(t('login_err_conn'), true); });
    }
  });
  document.getElementById('adminGenMsg').addEventListener('click', function (e) {
    var b = e.target.closest('.kcopy');
    if (!b) return;
    var k = b.getAttribute('data-k');
    if (!k || !navigator.clipboard || !navigator.clipboard.writeText) return;
    navigator.clipboard.writeText(k).then(function () { toast(t('k_copied'), false); }).catch(function () {});
  });
  applyLang();
  checkSession();
  setInterval(watchSession, 20000);
}
init();
</script>
</body>
</html>
