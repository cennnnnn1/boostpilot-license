<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2733"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
  </defs>
  
  <polygon points="200,26 362,282 38,282" fill="url(#bg)" opacity="0.05"/>
  <polygon points="200,60 318,262 82,262" fill="#da3b2f" opacity="0.22"/>
  <polygon points="200,92 286,244 114,244" fill="#ff6b5b" opacity="0.5"/>
  <polygon points="200,116 262,232 138,232" fill="#ff8a6e" filter="url(#glow)"/>
  <polygon points="200,116 262,232 138,232" fill="#ffb3a0"/>
  <text x="200" y="196" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#sh)" >APEX</text>
  <text x="200" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="8" fill="#dfe3ea">LEGENDS</text>
</svg>