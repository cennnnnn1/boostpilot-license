<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141e4d"/>
      <stop offset="1" stop-color="#0c0a22"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <polygon points="200,40 300,150 200,260 100,150" fill="#e23636" opacity="0.9" filter="url(#glow)"/>
  <polygon points="200,40 300,150 200,260 100,150" fill="#ff7a7a" opacity="0.55"/>
  <polygon points="200,74 272,150 200,226 128,150" fill="none" stroke="#fff" stroke-width="5" opacity="0.9"/>
  <path d="M60,300 L40,240 L90,210 L120,300 Z" fill="#ffffff" opacity="0.85"/>
  <text x="200" y="184" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="3" fill="#ff5c5c" filter="url(#sh)" >MARVEL</text>
  <text x="200" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#dfe3ea">RIVALS</text>
</svg>