<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#2f6fd0"/>
      <stop offset="1" stop-color="#0b2150"/>
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <g transform="translate(200 130)">
    <path d="M-92 58 L-84 -26 L-40 4 L0 -58 L40 4 L84 -26 L92 58 Z" fill="#f0d04b" opacity="0.9" filter="url(#glow)"/>
    <path d="M-92 58 L-84 -26 L-40 4 L0 -58 L40 4 L84 -26 L92 58 Z" fill="#fff3b0"/>
    <rect x="-82" y="58" width="164" height="26" rx="4" fill="#f0d04b"/>
    <rect x="-92" y="96" width="184" height="22" rx="4" fill="#d9a524"/>
  </g>
  <text x="200" y="232" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="1" fill="#ffffff" filter="url(#sh)" >CLASH ROYALE</text>
  
</svg>