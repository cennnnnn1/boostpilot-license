<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#050c1a"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <g transform="translate(200 130)">
    <polygon points="0 -118 102 -59 102 59 0 118 -102 59 -102 -59" fill="none" stroke="#c8aa6e" stroke-width="14" opacity="0.9" filter="url(#glow)"/>
    <polygon points="0 -118 102 -59 102 59 0 118 -102 59 -102 -59" fill="none" stroke="#f0d9a0" stroke-width="6"/>
  </g>
  <text x="200" y="186" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="3" fill="#ffffff" filter="url(#sh)" >LEAGUE</text>
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="5" fill="#c8aa6e">OF LEGENDS</text>
</svg>