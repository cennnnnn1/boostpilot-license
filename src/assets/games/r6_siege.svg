<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20262e"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <g transform="translate(200 118)">
    <polygon points="0 -86 74 -43 74 43 0 86 -74 43 -74 -43" fill="none" stroke="#f6c13f" stroke-width="16" opacity="0.9" filter="url(#glow)"/>
    <polygon points="0 -86 74 -43 74 43 0 86 -74 43 -74 -43" fill="none" stroke="#ffe9a0" stroke-width="5"/>
    <text x="0" y="18" text-anchor="middle" font-family="Arial Black, Arial" font-size="52" font-weight="900" fill="#f6c13f">6</text>
  </g>
  <text x="200" y="186" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="2" fill="#ffffff" filter="url(#sh)" >R6</text>
  <text x="200" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#f6c13f">SIEGE</text>
</svg>