<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0.25" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4a1e6e"/>
      <stop offset="1" stop-color="#170b33"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <polygon points="160,40 300,40 260,170 380,170 200,300 240,170 120,170" fill="#a25bff" opacity="0.9" filter="url(#glow)"/>
  <polygon points="160,40 300,40 260,170 380,170 200,300 240,170 120,170" fill="#c893ff"/>
  <polygon points="20,214 60,214 44,262 4,262" fill="#7ad0ff" opacity="0.9" filter="url(#glow)"/>
  <polygon points="20,214 60,214 44,262 4,262" fill="#c4ecff"/>
  <text x="200" y="196" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#sh)" >FORTNITE</text>
  
</svg>