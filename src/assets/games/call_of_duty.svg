<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#23262e"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <path d="M60,0 L160,0 L40,300 L-40,300 Z" fill="#ff7a2e" opacity="0.18"/>
  <path d="M250,0 L320,0 L220,300 L150,300 Z" fill="#ff7a2e" opacity="0.10"/>
  <path d="M0,232 L400,168 L400,204 L0,268 Z" fill="#ffffff" opacity="0.05"/>
  <path d="M130,66 L268,66 L268,96 L130,96 Z" fill="none" stroke="#ff7a2e" stroke-width="3" opacity="0.85"/>
  <text x="200" y="196" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#ffffff" filter="url(#sh)" >CALL OF DUTY</text>
  <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#ff7a2e">RANK BOOST</text>
</svg>