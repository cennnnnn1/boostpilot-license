<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.95">
      <stop offset="0" stop-color="#0d3a8f"/>
      <stop offset="1" stop-color="#041a40"/>
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <path d="M120,40 L220,10 L180,120 L300,70 L250,180 L360,150 L310,240 L220,300 L60,300 L0,140 Z" fill="#ffffff" opacity="0.06"/>
  <circle cx="200" cy="132" r="70" fill="#f04a1e" opacity="0.95" filter="url(#glow)"/>
  <circle cx="200" cy="132" r="70" fill="#ff7a4a"/>
  <circle cx="200" cy="132" r="44" fill="none" stroke="#fff" stroke-width="4" opacity="0.9"/>
  <circle cx="200" cy="132" r="14" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="190" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="3" fill="#ffffff" filter="url(#sh)" >ROCKET</text>
  <text x="200" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#f04a1e">LEAGUE</text>
</svg>