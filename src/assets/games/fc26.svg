<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#0d3a5c"/>
      <stop offset="1" stop-color="#04131f"/>
    </radialGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#dots)"/>
  <circle cx="200" cy="118" r="74" fill="none" stroke="#1fd970" stroke-width="3" opacity="0.35"/>
  <circle cx="200" cy="118" r="52" fill="#1fd970" opacity="0.14"/>
  <polygon points="200,86 224,106 214,136 186,136 176,106" fill="#1fd970" opacity="0.85" filter="url(#glow)"/>
  <path d="M120,268 L400,176 L400,206 L120,298 Z" fill="#1fd970" opacity="0.12"/>
  <text x="200" y="166" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="8" fill="#ffffff" filter="url(#sh)" >EA SPORTS</text>
  <text x="200" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="2" fill="#4ff0a0">FC</text>
</svg>