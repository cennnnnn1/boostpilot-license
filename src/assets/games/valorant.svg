<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#232732"/>
      <stop offset="1" stop-color="#0f1116"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bg)"/>
  <path d="M330,0 L400,0 L400,120 Z" fill="#ff4655" opacity="0.10"/>
  <path d="M70,300 L0,300 L0,180 Z" fill="#ff4655" opacity="0.10"/>
  <g transform="translate(200 132)">
    <polygon points="0 -100 62 -50 62 50 0 100 -62 50 -62 -50" fill="none" stroke="#ff4655" stroke-width="16" opacity="0.9" filter="url(#glow)"/>
    <polygon points="0 -100 62 -50 62 50 0 100 -62 50 -62 -50" fill="none" stroke="#ff7a85" stroke-width="5"/>
    <polygon points="0 -52 28 -26 28 26 0 52 -28 26 -28 -26" fill="#ff4655" opacity="0.9"/>
  </g>
  <text x="200" y="200" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#sh)" >VALORANT</text>
  
</svg>