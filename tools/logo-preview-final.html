<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0d13; color: #ecf1fd; padding: 40px; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #92a3c3; font-size: 13px; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
  .card { background: #10141d; border: 1px solid #1f2a42; border-radius: 16px; padding: 24px; }
  .card h2 { font-size: 16px; margin-bottom: 4px; }
  .card p { color: #92a3c3; font-size: 12px; margin-bottom: 20px; min-height: 32px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .tile { flex: none; display: flex; align-items: center; justify-content: center; background: transparent; }
  .tile.small { width: 24px; height: 24px; }
  .tile.med { width: 48px; height: 48px; }
  .tile.large { width: 300px; height: 300px; border-radius: 60px; margin: 0 auto 8px; }
  .tile.small svg { width: 24px; height: 24px; }
  .tile.med svg { width: 48px; height: 48px; }
  .tile.large svg { width: 300px; height: 300px; }
  .scale { text-align: center; color: #92a3c3; font-size: 12px; }
</style>
</head>
<body>
  <h1>BoostPilot — Logo flecha estilo opencode</h1>
  <div class="sub">Fondo oscuro (no negro puro), flecha con relieve 3D. 1 = réplica opencode (blanca), 2 = colores del panel (rosado + negro).</div>
  <div class="grid" id="grid"></div>
<script>
const data = [
  { id: 'opencode', name: 'Estilo opencode', desc: 'Flecha blanca con bisel 3D y sombra de profundidad, fondo grafito suave.' },
  { id: 'panel', name: 'Colores del panel', desc: 'Flecha rosada con relieve negro, glow sutil y borde interior negro.' },
];
window.__SVGS__.then(function (svgs) {
  document.getElementById('grid').innerHTML = data.map(function (d) {
    return '<div class="card">' +
      '<h2>' + d.name + '</h2>' +
      '<p>' + d.desc + '</p>' +
      '<div class="row">' +
      '<div class="tile small">' + svgs[d.id] + '</div>' +
      '<div class="tile med">' + svgs[d.id] + '</div>' +
      '</div>' +
      '<div class="tile large">' + svgs[d.id] + '</div>' +
      '<div class="scale">300px · 48px · 24px</div>' +
      '</div>';
  }).join('');
});
</script>
</body>
</html>
