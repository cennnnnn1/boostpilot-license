<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #000; color: #ecf1fd; padding: 40px; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #92a3c3; font-size: 13px; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .card { background: #0b0f1a; border: 1px solid #1f2a42; border-radius: 16px; padding: 22px; }
  .card h2 { font-size: 15px; margin-bottom: 4px; }
  .card p { color: #92a3c3; font-size: 12px; margin-bottom: 18px; min-height: 32px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .tile { width: 42px; height: 42px; border-radius: 13px; flex: none; display: flex; align-items: center; justify-content: center; position: relative; background: #000; border: 1px solid #1f2a42; }
  .tile.small { width: 22px; height: 22px; border-radius: 7px; }
  .tile.large { width: 150px; height: 150px; border-radius: 34px; margin-top: 8px; }
  .tile svg { width: 26px; height: 26px; position: relative; z-index: 1; }
  .tile.large svg { width: 88px; height: 88px; }
  .tile.small svg { width: 14px; height: 14px; }
  .name { font-size: 17px; font-weight: 800; }
  .name em { font-style: normal; background: linear-gradient(90deg, #ffc94d, #ff8a3d, #ff6a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
  <h1>BoostPilot — Misma tanda, acabado 3D</h1>
  <div class="sub">Volumen con gradientes radiales, brillos especulares, profundidad y glow. Mismas 8 ideas, nivel premium.</div>
  <div class="grid" id="grid"></div>
<script>
const NAME = 'Boost<em>Pilot</em>';
const data = [
  { id: '1', name: 'Glitch B 3D', desc: 'B extruida con profundidad, slicing RGB y resplandor neón.' },
  { id: '2', name: 'Portal 3D', desc: 'Vórtice en perspectiva con energía fluyendo hacia adentro.' },
  { id: '3', name: 'Fantasma 3D', desc: 'Ghost glossy con cuerpo volumétrico y aura luminosa.' },
  { id: '4', name: 'Núcleo 3D', desc: 'Esfera de cristal con red neural y electrones en órbita.' },
  { id: '5', name: 'Gema 3D', desc: 'Diamante con facetas iluminadas/sombreadas y destellos.' },
  { id: '6', name: 'Anillos 3D', desc: 'Anillos como toros con grosor y punto de luz acelerando.' },
  { id: '7', name: 'DNA 3D', desc: 'Doble hélice con hebras glossy y glow interior.' },
  { id: '8', name: 'Orbe orbital 3D', desc: 'Esfera con sombreado esférico real, anillos en 3 planos y trayectoria.' },
];
window.__SVGS__.then(function (svgs) {
  document.getElementById('grid').innerHTML = data.map(function (d) {
    return '<div class="card">' +
      '<h2>' + d.id + '. ' + d.name + '</h2>' +
      '<p>' + d.desc + '</p>' +
      '<div class="row"><div class="tile small">' + svgs[d.id] + '</div>' +
      '<div class="tile">' + svgs[d.id] + '</div>' +
      '<span class="name">' + NAME + '</span></div>' +
      '<div class="tile large">' + svgs[d.id] + '</div>' +
      '</div>';
  }).join('');
});
</script>
</body>
</html>
