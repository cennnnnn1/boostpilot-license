<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #000; color: #ecf1fd; padding: 40px; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #92a3c3; font-size: 13px; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .card { background: #0b0f1a; border: 1px solid #1f2a42; border-radius: 16px; padding: 22px; }
  .card h2 { font-size: 15px; margin-bottom: 4px; }
  .card p { color: #92a3c3; font-size: 12px; margin-bottom: 18px; min-height: 32px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .tile { width: 42px; height: 42px; border-radius: 13px; flex: none; display: flex; align-items: center; justify-content: center; position: relative; background: #000; border: 1px solid #1f2a42; }
  .tile.small { width: 22px; height: 22px; border-radius: 7px; }
  .tile.large { width: 120px; height: 120px; border-radius: 30px; margin-top: 8px; }
  .tile svg { width: 24px; height: 24px; position: relative; z-index: 1; }
  .tile.large svg { width: 64px; height: 64px; }
  .tile.small svg { width: 13px; height: 13px; }
  .name { font-size: 17px; font-weight: 800; }
  .name em { font-style: normal; background: linear-gradient(90deg, #ffc94d, #ff8a3d, #ff6a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
  <h1>BoostPilot — Ideas locas y modernas</h1>
  <div class="sub">Fondo negro del panel, gradiente BoostPilot (#ffc94d → #ff9a3d → #ff6a8a) con acentos de los colores de UI</div>
  <div class="grid" id="grid"></div>
<script>
const NAME = 'Boost<em>Pilot</em>';
const data = [
  { id: '1', name: 'Glitch B / glitch de velocidad', desc: 'Letra B con efecto glitch de slicing RGB. Ultra moderno, gaming/tech.' },

  { id: '5', name: 'Gema cortada', desc: 'Diamante facetado con cortes asimétricos. Premium, valor, precisión.' },

const svgs = {

  <circle cx="8.4" cy="7.2" r="1" fill="#1b1220"/>
  <circle cx="15.6" cy="7.2" r="1" fill="#1b1220"/>
  <path d="M2 5.5c2-1.8 4-1.8 6 0M16 5.5c2-1.8 4-1.8 6 0M3 2.8c1.6-1.5 3.2-1.5 4.8 0M16 2.8c1.6-1.5 3.2-1.5 4.8 0" stroke="#66b3ff" stroke-width=".7" stroke-linecap="round" opacity=".7"/>
</svg>`,
'4': `<svg viewBox="0 0 24 24">
  <defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc94d"/><stop offset=".5" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ff6a8a"/></linearGradient></defs>

'7': `<svg viewBox="0 0 24 24">

'8': `<svg viewBox="0 0 24 24">
  <defs><linearGradient id="g8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc94d"/><stop offset=".5" stop-color="#ff9a3d"/><stop offset="1" stop-color="#ff6a8a"/></linearGradient></defs>

</svg>`,
};
function renderCard(d) {
  const svg = svgs[d.id];
  return `<div class="card">
    <h2>${d.id}. ${d.name}</h2>
    <p>${d.desc}</p>
    <div class="row">
      <div class="tile small">${svg}</div>
      <div class="tile">${svg}</div>
      <span class="name">${NAME}</span>
    </div>
    <div class="tile large">${svg}</div>
  </div>`;
}
document.getElementById('grid').innerHTML = data.map(renderCard).join('');
</script>
</body>
</html>
