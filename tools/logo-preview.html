<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #000; color: #ecf1fd; padding: 40px; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #92a3c3; font-size: 13px; margin-bottom: 30px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .card { background: #0b0f1a; border: 1px solid #1f2a42; border-radius: 16px; padding: 22px; }
  .card h2 { font-size: 15px; margin-bottom: 4px; }
  .card p { color: #92a3c3; font-size: 12px; margin-bottom: 18px; min-height: 32px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .brand-logo {
    width: 42px; height: 42px; border-radius: 13px; flex: none;
    background: linear-gradient(135deg, #ffc94d 0%, #ff9a3d 45%, #ff6a8a 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(255,154,61,.35); position: relative;
  }
  .brand-logo::after { content: ''; position: absolute; inset: 0; border-radius: 13px; background: linear-gradient(160deg, rgba(255,255,255,.35), transparent 55%); }
  .brand-logo svg { width: 24px; height: 24px; fill: #1b1220; position: relative; z-index: 1; }
  .brand-logo.small { width: 22px; height: 22px; border-radius: 7px; box-shadow: 0 3px 8px rgba(255,154,61,.3); }
  .brand-logo.small svg { width: 13px; height: 13px; }
  .brand-logo.large { width: 96px; height: 96px; border-radius: 26px; }
  .brand-logo.large svg { width: 52px; height: 52px; }
  .name { font-size: 17px; font-weight: 800; }
  .name em { font-style: normal; background: linear-gradient(90deg, #ffc94d, #ff8a3d, #ff6a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
  <h1>BoostPilot — Ideas de logo</h1>
  <div class="sub">Vista a 22px (barra), 42px (topbar/login) y 96px (grande) sobre fondo negro del panel</div>
  <div class="grid" id="grid"></div>
<script>
const ID = window.__LOGO_ID__ || '';
const NAME = 'Boost<em>Pilot</em>';
const data = [
  { id: '1', name: 'Cohete acelerando', desc: 'Cohete apuntando arriba-derecha con estela de 3 trazos. Directo a "boost".' },
  { id: '2', name: 'Escudo B de velocidad', desc: 'Escudo redondeado con una B formada por líneas de velocidad. Seguridad + potencia.' },
  { id: '3', name: 'Joystick gaming', desc: 'Gamepad minimalista de trazo simple. Conecta con el nicho Eldorado.' },
  { id: '4', name: 'Brújula del piloto', desc: 'Aguja de compás apuntando a una estrella. Guía y precisión ("Pilot").' },
  { id: '5', name: 'Órbita de boost', desc: 'Flecha curva en órbita acelerando hacia adelante. Moderno y abstracto.' },
  { id: '6', name: 'Rayo sobre raíles', desc: 'Rayo geométrico con dos líneas de velocidad. Máxima claridad en tamaño chico.' },
  { id: '7', name: 'Alas / B alada', desc: 'Dos alas que se cruzan formando una B. Premium, aire de piloto.' },
];
const svgs = {
'1': `<svg viewBox="0 0 24 24"><path d="M12 3c3 5 4 9 4 12a4 4 0 11-8 0c0-3 1-7 4-12z"/><path d="M9.5 15.5c2 1.8 3-1 1-2.2M14.5 15.5c-2 1.8-3-1-1-2.2"/><path d="M12 12v5"/><path d="M3.5 16.5c1.5.8 3 .8 4.5 0M20.5 16.5c-1.5.8-3 .8-4.5 0"/></svg>`,
'2': `<svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z"/><path d="M8.5 7.5h5.5l-4.5 5h4L9 17.5"/><path d="M14.5 5.5c1 1.3 1.5 2.8 1.5 4.5"/></svg>`,
'3': `<svg viewBox="0 0 24 24"><path d="M7 6h10a5 5 0 015 5v3a3 3 0 01-3 3h-1.5a2 2 0 01-1.7-1L14.6 15H9.4l-1.2 1a2 2 0 01-1.7 1H5a3 3 0 01-3-3v-3a5 5 0 015-5z"/><path d="M7.5 11.5h.01M16.5 11.5h.01M10.5 8h3v3h-3z"/></svg>`,
'4': `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 3.5v3M20.5 12h-3M12 20.5v-3M3.5 12h3"/><path d="M14.5 9.5L10 14l-1.5 3 3-1.5 4.5-4.5z"/><path d="M12 14.2l2.2-4.2-4.2 2.2 2 .6z"/></svg>`,
'5': `<svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 11-2.5-6"/><path d="M21 3.5v4.5h-4.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 9.8V7M14.2 12H17"/></svg>`,
'6': `<svg viewBox="0 0 24 24"><path d="M14 2L5 13h5l-2 9 9-11h-5l2-9z"/><path d="M2.5 17.5h4M4 14.5v6M17.5 17.5h4M19 14.5v6"/></svg>`,
'7': `<svg viewBox="0 0 24 24"><path d="M3.5 12c4.5 1.5 8.5 4.5 10.5 9 0 0 1-6-3-11.5C7.5 5.5 4 5.5 3.5 12z"/><path d="M20.5 12c-4.5 1.5-8.5 4.5-10.5 9 0 0-1-6 3-11.5C16.5 5.5 20 5.5 20.5 12z"/><path d="M4 3.5C8 5 10 7.5 10.5 10M20 3.5C16 5 14 7.5 13.5 10"/></svg>`,
};
function renderCard(d) {
  const svg = svgs[d.id];
  return `<div class="card">
    <h2>${d.id}. ${d.name}</h2>
    <p>${d.desc}</p>
    <div class="row">
      <div class="brand-logo small">${svg}</div>
      <div class="brand-logo">${svg}</div>
      <span class="name">${NAME}</span>
    </div>
    <div class="brand-logo large">${svg}</div>
  </div>`;
}
document.getElementById('grid').innerHTML = data.map(renderCard).join('');
</script>
</body>
</html>
